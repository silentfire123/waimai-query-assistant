<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>外卖查询助手</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="top"><a class="brand" href="/" aria-label="外卖查询助手首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 10h22l-2 17H7L5 10ZM11 11V8a5 5 0 0 1 10 0v3M12 18h8"/></svg><span>外卖查询助手</span></a><span class="local">本地自用版</span></header>
<main>
<section class="intro"><h1>两份返现名单，<br class="mobile-break">一次找到交集。</h1><p>比对小蚕中的美团实付满返与比例返，帮你少翻几页。</p></section>
<section class="query-panel" aria-label="查询设置"><div class="location-line"><div><span class="field-label">查询位置</span><strong id="location-name">尚未设置</strong><span id="location-detail"></span></div><button id="edit-location" class="text-button">设置位置</button></div>
<form id="location-form" hidden><p class="form-help">使用 GCJ-02（火星坐标）经纬度，与现有小蚕查询保持一致。首次可导入旧 PoC 位置。</p><div class="fields"><label>位置名称<input name="label" required maxlength="60" placeholder="例如：公司附近" autocomplete="off"></label><label>纬度<input name="lat" type="number" step="any" min="-90" max="90" required placeholder="例如：34.2"></label><label>经度<input name="lng" type="number" step="any" min="-180" max="180" required placeholder="例如：108.9"></label><label>行政区划代码<input name="adcode" required pattern="[1-9][0-9]{5}" inputmode="numeric" maxlength="6" placeholder="6 位数字"></label></div><div class="form-actions"><button type="submit" class="secondary">保存位置</button><button type="button" id="import-location" class="text-button">导入旧 PoC 已选位置</button><button type="button" id="cancel-location" class="text-button">收起</button></div></form>
<div class="query-actions"><label class="pages">采集范围<select id="pages"><option value="1">每类最多 1 页</option><option value="2">每类最多 2 页</option><option value="3">每类最多 3 页</option></select></label><div class="run-area"><span id="query-hint">手动查询 · 不会自动刷新接口</span><button id="query" class="primary" disabled>查询重合商家<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div>
</section>
<div id="message" role="status" aria-live="polite" hidden></div>
<section class="results" aria-labelledby="results-heading"><div class="section-top"><div><h2 id="results-heading">查询结果</h2><p id="result-meta">还没有查询结果</p></div><button id="demo" class="text-button">查看演示</button></div>
<div id="attempt" class="notice error" hidden role="alert"></div><div id="scope-note" class="notice" hidden></div><div id="demo-banner" class="notice" hidden>正在查看虚构演示，未请求真实接口。<button id="leave-demo" class="text-button">返回真实结果</button></div>
<div class="result-tools"><nav id="tabs" aria-label="结果分类"><button data-tab="overlap" aria-pressed="true">重合商家 <span id="count-overlap">0</span></button><button data-tab="full" aria-pressed="false">实付满返 <span id="count-full">0</span></button><button data-tab="ratio" aria-pressed="false">比例返 <span id="count-ratio">0</span></button></nav><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索当前名单" aria-label="搜索当前名单"></label></div>
<div id="result-list" aria-live="polite"></div>
<details id="coverage"><summary>采集范围与判断依据</summary><ul id="notes"></ul></details>
</section>
<footer><p>名单重合 ≠ 返现可以叠加。下单前请在小程序核对活动、时段与参与资格。</p><span>位置与结果仅保存在本机 · 不自动下单</span></footer>
</main>
</body></html>
