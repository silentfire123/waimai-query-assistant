<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>外卖查询助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="top"><a class="brand" href="/" aria-label="外卖查询助手首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 10h22l-2 17H7L5 10ZM11 11V8a5 5 0 0 1 10 0v3M12 18h8"/></svg><span>外卖查询助手</span></a><span class="local">本地自用版</span></header>
<main>
<section class="intro"><h1>多渠道返现名单，<br class="mobile-break">一次找到交集。</h1><p>汇总小蚕、歪麦的美团满返与比例返，计算返后预计净支出。</p></section>
<section class="query-panel" aria-label="查询设置"><div class="location-line"><div><span class="field-label">查询位置</span><strong id="location-name">尚未设置</strong><span id="location-detail"></span></div><button id="edit-location" class="text-button">设置位置</button></div>
<form id="location-form" hidden><div class="location-picker"><label>搜索地址<input id="address-keyword" maxlength="80" autocomplete="off" placeholder="城市 + 小区 / 公司"></label><div class="form-actions"><button type="button" id="search-address" class="secondary">搜索选点</button><button type="button" id="locate-once" class="text-button">获取当前位置（仅一次）</button></div><p id="location-operation" class="form-help" role="status" hidden></p><p id="location-status" role="status"></p><div id="address-results"></div></div><p id="location-help" class="form-help">使用 GCJ-02（火星坐标）经纬度，与现有小蚕查询保持一致。首次可导入旧 PoC 位置。</p><div class="fields"><label>位置名称<input name="label" required maxlength="60" placeholder="例如：公司附近" autocomplete="off"></label><label>城市名称（歪麦查询使用）<input name="city" maxlength="40" placeholder="例如：北京市"></label><label>纬度<input name="lat" type="number" step="any" min="-90" max="90" required placeholder="例如：34.2"></label><label>经度<input name="lng" type="number" step="any" min="-180" max="180" required placeholder="例如：108.9"></label><label>行政区划代码<input name="adcode" required pattern="[1-9][0-9]{5}" inputmode="numeric" maxlength="6" placeholder="6 位数字"></label></div><input name="coordinateSystem" type="hidden" value="GCJ-02"><div class="form-actions"><button type="submit" class="secondary">保存位置</button><button type="button" id="import-location" class="text-button">导入旧 PoC 已选位置</button><button type="button" id="cancel-location" class="text-button">收起</button></div></form>
<div class="query-actions"><label class="pages">采集范围<select id="pages"><option value="10" selected>每类最多 10 页</option><option value="20">每类最多 20 页</option></select></label><div class="run-area"><span id="query-hint">手动查询 · 不会自动刷新接口</span><button id="query" class="primary" disabled>查询重合商家<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div>
</section>
<div id="message" role="status" aria-live="polite">正在连接服务；若免费实例休眠，唤醒可能需要等待。</div><button id="retry-connect" class="text-button" hidden>重试连接</button>
<section class="results" aria-labelledby="results-heading"><div class="section-top"><div><h2 id="results-heading">查询结果</h2><p id="result-meta">还没有查询结果</p></div><button id="demo" class="text-button">查看演示</button></div>
<div id="attempt" class="notice error" hidden role="alert"><details id="attempt-details"><summary><span id="attempt-summary"></span><span class="disclosure-toggle" aria-hidden="true"></span></summary><div id="attempt-detail" class="notice-detail"></div></details><div id="attempt-critical" hidden></div></div><details id="scope-note" class="notice" hidden><summary><span id="scope-summary"></span><span class="disclosure-toggle" aria-hidden="true"></span></summary><div id="scope-detail" class="notice-detail"></div></details><div id="demo-banner" class="notice" hidden>正在查看虚构演示，未请求真实接口。<button id="leave-demo" class="text-button">返回真实结果</button></div>
<div class="result-tools"><nav id="tabs" aria-label="结果分类"><button data-tab="overlap" aria-pressed="true">重合商家 <span id="count-overlap">0</span></button><button data-tab="full" aria-pressed="false">实付满返 <span id="count-full">0</span></button><button data-tab="ratio" aria-pressed="false">比例返 <span id="count-ratio">0</span></button></nav><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索当前名单" aria-label="搜索当前名单"></label></div>
<div id="result-list" aria-live="polite"></div>
<p id="query-id" class="form-help"></p><a id="export-diagnostic" href="/api/diagnostics" class="text-button" download="diagnostic.json">导出最近查询诊断（已脱敏）</a><details id="coverage"><summary>采集范围与判断依据</summary><ul id="notes"></ul></details>
</section>
<footer><p>名单重合 ≠ 返现可以叠加。计算仅为试算，不保证到账；原始活动条件仍以各渠道为准。</p><span>位置与结果保存在当前服务 · 不自动下单</span></footer>
</main>
</body></html>
