name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.mjs
      - run: node --check poc.mjs
      - run: node --check web/app.js
      - run: node --check waimai.mjs
      - run: node --check collector.mjs
      - run: node --check diagnostics.mjs
      - run: node --check location.mjs
      - run: node --check web/calculator.mjs
      - run: npm test
